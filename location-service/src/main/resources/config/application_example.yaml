server:
  port: 8082
spring:
  application:
    name: location-service
  datasource:
    url: jdbc:postgresql://localhost:5432/<your_DB_name>
    username: <PostgreSQL username>
    password: <PostgreSQL password>
  flyway:
    enabled: true
    out-of-order: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
jwt:
  secret: <same secret as cargo-core-service>
  expiration-ms: <same expiration or optional>
websocket:
  topics:
    driver-locations: /topic/driver-locations
location-simulator:
  enabled: false
  initial-delay-seconds: 30
  interval-seconds: 5
  steps-between-points: 10
  drivers:
    - driver-id: <DRIVER_ID>
      name: <DRIVER_NAME>
      route:
        - latitude: 1
          longitude: 1
        - latitude: 1
          longitude: 1

    - driver-id: <DRIVER_ID>
      name: <DRIVER_NAME>
      route:
        - latitude: 1
          longitude: 1
        - latitude: 1
          longitude: 1