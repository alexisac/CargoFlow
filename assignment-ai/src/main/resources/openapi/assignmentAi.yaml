openapi: 3.0.3
info:
  version: 1.0.0
  title: Assignment AI
  description: API related to AI-assisted trip assignment optimization

paths:
  /assignment-ai/trips/{tripId}/optimize:
    post:
      tags:
        - Assignment AI
      summary: Find the optimal driver, primary vehicle and trailer assignment for a trip
      operationId: optimizeTripAssignment
      parameters:
        - name: tripId
          in: path
          required: true
          description: Trip identifier
          schema:
            type: integer
            format: int64
            example: 100
      requestBody:
        description: Candidate assignments to evaluate
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeAssignmentRequest'
      responses:
        '200':
          description: Optimal assignment was calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimalAssignmentResponse'
        '400':
          description: Invalid request or no valid candidates available
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
  /assignment-ai/trips/{tripId}/feedback:
    post:
      tags:
        - Assignment AI
      summary: Save dispatcher feedback for an AI assignment recommendation
      operationId: saveAssignmentFeedback
      parameters:
        - name: tripId
          in: path
          required: true
          description: Trip identifier
          schema:
            type: integer
            format: int64
      requestBody:
        description: Feedback about evaluated candidates and the selected assignment
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentFeedbackRequest'
      responses:
        '200':
          description: Feedback was saved successfully
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
  /assignment-ai/model/train:
    post:
      tags:
        - Assignment AI
      summary: Retrain the Random Forest assignment model
      operationId: trainAssignmentModel
      responses:
        '200':
          description: Model was trained successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainAssignmentModelResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
  /assignment-ai/trips/{tripId}/auto-optimize:
    post:
      tags:
        - Assignment AI
      summary: Automatically generate candidates and optimize trip assignment
      operationId: autoOptimizeTripAssignment
      parameters:
        - name: tripId
          in: path
          required: true
          description: Trip identifier
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Optimal assignment was calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimalAssignmentResponse'
        '400':
          description: Invalid request or no valid candidates available
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
components:
  schemas:
    OptimizeAssignmentRequest:
      type: object
      required:
        - candidates
      properties:
        candidates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssignmentCandidate'
    OptimalAssignmentResponse:
      type: object
      required:
        - tripId
        - driverId
        - primaryVehicleId
        - confidence
        - modelType
      properties:
        tripId:
          type: integer
          format: int64
          example: 100
        driverId:
          type: integer
          format: int64
          example: 26
        primaryVehicleId:
          type: integer
          format: int64
          example: 5
        trailerId:
          type: integer
          format: int64
          nullable: true
          example: 12
        confidence:
          type: number
          format: double
          example: 0.87
        modelType:
          type: string
          example: RANDOM_FOREST_CLASSIFIER
    AssignmentCandidate:
      type: object
      required:
        - tripId
        - driverId
        - primaryVehicleId
        - driverLatitude
        - driverLongitude
        - pickupAddress
        - primaryVehicleType
        - keepsPreviousPrimaryVehicle
        - keepsPreviousTrailer
        - trailerRequired
        - driverAvailable
        - primaryVehicleAvailable
        - trailerAvailable
      properties:
        tripId:
          type: integer
          format: int64
          example: 100
        driverId:
          type: integer
          format: int64
          example: 26
        primaryVehicleId:
          type: integer
          format: int64
          example: 5
        trailerId:
          type: integer
          format: int64
          nullable: true
          example: 12

        driverLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 44.4268
        driverLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 26.1025

        pickupAddress:
          $ref: '#/components/schemas/Address'

        cargoWeight:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 8000
        cargoVolume:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 35

        primaryVehicleType:
          $ref: '#/components/schemas/VehicleType'
        primaryVehicleMaxWeight:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 22000
        primaryVehicleMaxVolume:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 80

        trailerType:
          allOf:
            - $ref: '#/components/schemas/VehicleType'
          nullable: true
        trailerMaxWeight:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 22000
        trailerMaxVolume:
          type: number
          format: double
          nullable: true
          minimum: 0
          example: 80

        keepsPreviousPrimaryVehicle:
          type: boolean
          example: true
        keepsPreviousTrailer:
          type: boolean
          example: true
        trailerRequired:
          type: boolean
          example: true
        driverAvailable:
          type: boolean
          example: true
        primaryVehicleAvailable:
          type: boolean
          example: true
        trailerAvailable:
          type: boolean
          example: true

        minutesUntilPickup:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          example: 180
        driverCompletedTripsLast30Days:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          example: 8
    Address:
      type: object
      required:
        - country
        - administrativeArea
        - city
        - streetName
        - streetNumber
        - postalCode
      properties:
        country:
          type: string
          example: Romania
        administrativeArea:
          type: string
          example: Bucuresti
        city:
          type: string
          example: Bucuresti
        streetName:
          type: string
          example: Bulevardul Unirii
        streetNumber:
          type: string
          example: 1
        postalCode:
          type: string
          example: '030167'
        additionalDetails:
          type: string
          nullable: true
          example: Near the main entrance
    VehicleType:
      type: string
      enum:
        - TRACTOR_UNIT
        - VAN
        - BOX_TRUCK
        - REFRIGERATED_TRUCK
        - TANKER_TRUCK
        - SEMI_TRAILER
        - REFRIGERATED_TRAILER
        - TANKER_TRAILER
      example: TRACTOR_UNIT
    AssignmentFeedbackRequest:
      type: object
      required:
        - selectedDriverId
        - selectedPrimaryVehicleId
        - evaluatedCandidates
      properties:
        selectedDriverId:
          type: integer
          format: int64
          example: 26
        selectedPrimaryVehicleId:
          type: integer
          format: int64
          example: 5
        selectedTrailerId:
          type: integer
          format: int64
          nullable: true
          example: 12
        evaluatedCandidates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssignmentCandidate'
    TrainAssignmentModelResponse:
      type: object
      required:
        - trained
        - trainingExamplesCount
        - modelType
      properties:
        trained:
          type: boolean
          example: true
        trainingExamplesCount:
          type: integer
          format: int32
          example: 128
        modelType:
          type: string
          example: RANDOM_FOREST_CLASSIFIER
        message:
          type: string
          example: Random Forest model was trained successfully