server:
  port: 8081
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: cargo-core-service
          uri: lb://CARGO-CORE-SERVICE
          predicates:
            - Path=/users/**,/trip/**,/vehicle/**,/tripAssignment/**,/internal/**

        - id: location-service
          uri: lb://LOCATION-SERVICE
          predicates:
            - Path=/locations/**

        - id: location-service-websocket
          uri: lb:ws://LOCATION-SERVICE
          predicates:
            - Path=/ws-locations,/ws-locations/**

        - id: assignment-ai
          uri: lb://ASSIGNMENT-AI
          predicates:
            - Path=/assignment-ai/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true