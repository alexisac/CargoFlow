openapi: 3.0.3
info:
  version: 1.0.0
  title: Trip assignment management
  description: API related to assigning drivers and vehicles to trips
paths:
  /tripAssignment/{tripId}/availableDrivers:
    get:
      tags:
        - Trip Assignments
      summary: Get available drivers for trip
      operationId: getAvailableDriversForTrip
      parameters:
        - name: tripId
          in: path
          description: Trip's ID
          required: true
          schema:
            type: integer
            format: int64
        - name: pageNumber
          in: query
          description: Page number
          required: true
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: pageSize
          in: query
          description: Page size
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
            example: 20
      responses:
        '200':
          description: Available drivers were retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableDriversResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '404':
          description: Trip was not found
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
  /tripAssignment/{tripId}/availablePrimaryVehicles:
    get:
      tags:
        - Trip Assignments
      summary: Get available primary vehicles for trip
      operationId: getAvailablePrimaryVehiclesForTrip
      parameters:
        - name: tripId
          in: path
          description: Trip's ID
          required: true
          schema:
            type: integer
            format: int64
        - name: pageNumber
          in: query
          description: Page number
          required: true
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: pageSize
          in: query
          description: Page size
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
            example: 20
      responses:
        '200':
          description: Available primary vehicles were retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableVehiclesResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '404':
          description: Trip was not found
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
  /tripAssignment/{tripId}/availableTrailers:
    get:
      tags:
        - Trip Assignments
      summary: Get available trailers for trip
      operationId: getAvailableTrailersForTrip
      parameters:
        - name: tripId
          in: path
          description: Trip's ID
          required: true
          schema:
            type: integer
            format: int64
        - name: pageNumber
          in: query
          description: Page number
          required: true
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: pageSize
          in: query
          description: Page size
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
            example: 20
      responses:
        '200':
          description: Available trailers were retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableVehiclesResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '404':
          description: Trip was not found
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
  /tripAssignment/assign:
    post:
      tags:
        - Trip Assignments
      summary: Assign driver and vehicle to trip
      operationId: assignTrip
      requestBody:
        description: Trip assignment data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTripRequest'
      responses:
        '201':
          description: Trip was assigned successfully
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '404':
          description: Trip, driver or vehicle was not found
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '409':
          description: Driver or vehicle is no longer available
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/GenericApplicationResponse'
components:
  schemas:
    AvailableDriver:
      type: object
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int64
          example: 15
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          example: Ion
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          example: Popescu
    AvailableDriversResponse:
      type: object
      required:
        - drivers
        - pageNumber
        - pageSize
        - lastPage
      properties:
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/AvailableDriver'
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        lastPage:
          type: boolean
          example: false
    AvailableVehicle:
      type: object
      required:
        - id
        - licencePlate
        - vehicleType
      properties:
        id:
          type: integer
          format: int64
          example: 12
        licencePlate:
          type: string
          example: B-101-TRK
        vehicleType:
          $ref: 'vehicle.yaml#/components/schemas/VehicleType'
    AvailableVehiclesResponse:
      type: object
      required:
        - vehicles
        - pageNumber
        - pageSize
        - lastPage
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/AvailableVehicle'
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        lastPage:
          type: boolean
          example: false
    AssignTripRequest:
      type: object
      required:
        - tripId
        - driverId
        - primaryVehicleId
      properties:
        tripId:
          type: integer
          format: int64
          example: 28
        driverId:
          type: integer
          format: int64
          example: 6
        primaryVehicleId:
          type: integer
          format: int64
          example: 1
        trailerVehicleId:
          type: integer
          format: int64
          nullable: true
          example: 5