components:
  schemas:
    GenericApplicationResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          description: Whether the operation was successful
          example: true
        code:
          type: string
          description: Application-specific result code
          example: 201 - USER_CREATED
        message:
          type: string
          description: Human-readable result message
          example: User was created successfully